<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClimbAI - Center of Mass Tracking</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Open+Sans:wght@400;600&display=swap');

        :root {
            --bg: #181a1f;
            /* Dark slate rock */
            --panel: #22252b;
            /* Lighter granite */
            --panel-border: #363a45;
            --text: #f8f9fa;
            /* Chalk white */
            --muted: #a0aab2;
            --accent: #ff6b35;
            /* Climbing tape orange */
            --accent-hover: #e85a28;
            --success: #20c997;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Open Sans', system-ui, sans-serif;
            background: var(--bg);
            background-image: radial-gradient(circle at top right, rgba(255, 107, 53, 0.04), transparent 40%),
                radial-gradient(circle at bottom left, rgba(32, 201, 151, 0.03), transparent 40%);
            color: var(--text);
        }

        /* Top Navigation */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
            background: var(--panel);
            border-bottom: 1px solid var(--panel-border);
            flex-wrap: wrap;
            gap: 16px;
        }

        .brand {
            display: flex;
            align-items: baseline;
            gap: 12px;
        }

        h1 {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -0.02em;
            color: var(--text);
        }

        h1 span {
            color: var(--accent);
        }

        .subtitle {
            color: var(--muted);
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: none;
        }

        @media (min-width: 600px) {
            .subtitle {
                display: block;
            }
        }

        /* Controls */
        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .controls button,
        .controls label {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            color: var(--text);
            border-radius: 6px;
            padding: 10px 18px;
            font-family: 'Open Sans', sans-serif;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .controls button:hover,
        .controls label:hover {
            border-color: var(--accent);
            background: rgba(255, 107, 53, 0.1);
        }

        .controls button.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .controls button.primary:hover {
            background: var(--accent-hover);
        }

        .controls input[type="file"] {
            display: none;
        }

        .status {
            background: rgba(32, 201, 151, 0.1);
            color: var(--success);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* Main Layout */
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 24px;
            padding: 24px 32px;
            max-width: 1600px;
            margin: 0 auto;
            align-items: start;
        }

        /* Video Section */
        .video-container {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .stage {
            position: relative;
            width: 100%;
            height: 75vh;
            /* Dynamic vertical height instead of fixed 16:9 ratio */
            min-height: 400px;
            background: #0a0b0e;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .stage video,
        .stage canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            /* Keeps vertical/horizontal videos correctly sized */
        }

        .stage canvas {
            pointer-events: none;
        }

        .hint {
            color: var(--muted);
            font-size: 0.85rem;
            text-align: center;
        }

        /* Data Analysis Panel */
        .analysis-panel {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .panel-header h2 {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.2rem;
            margin-bottom: 4px;
            color: var(--text);
        }

        .panel-header p {
            margin: 0;
            color: var(--muted);
            font-size: 0.85rem;
        }

        .data-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .data-card {
            background: var(--bg);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 16px;
            text-align: center;
        }

        .data-card.full-width {
            grid-column: 1 / -1;
        }

        .data-card h3 {
            margin: 0 0 8px 0;
            color: var(--muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .data-value {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--chalk);
        }

        .data-value.placeholder {
            color: #4a505e;
        }

        .chart-box {
            background: var(--bg);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            height: 220px;
            overflow: hidden;
            padding: 8px;
        }

        #velocity-chart {
            width: 100%;
            height: 100%;
            display: block;
        }

        @media (max-width: 1024px) {
            .dashboard {
                grid-template-columns: 1fr;
            }

            .stage {
                height: 60vh;
            }
        }
    </style>
</head>

<body>

    <header class="top-bar">
        <div class="brand">
            <h1>Climb<span>AI</span></h1>
            <span class="subtitle">Center of Mass Tracking</span>
        </div>
        <div class="controls">
            <span class="status" id="status-text">Loading model...</span>
            <button id="webcam-button" class="primary" type="button">
                Start Live Camera
            </button>
            <label>
                Upload Beta Video
                <input id="video-file" type="file" accept="video/*">
            </label>
        </div>
    </header>

    <main class="dashboard">
        <section class="video-container">
            <div class="stage">
                <video id="video" playsinline muted></video>
                <canvas id="overlay"></canvas>
            </div>
            <div class="hint">Upload a video of your project or use the webcam to overlay skeletal tracking.</div>
        </section>

        <aside class="analysis-panel">
            <div class="panel-header">
                <h2>Performance Data</h2>
                <p>Real-time CoM and balance telemetry</p>
            </div>

            <div class="data-grid">
                <div class="data-card">
                    <h3>CoM Stability</h3>
                    <div class="data-value placeholder" id="data-stability">-- %</div>
                </div>
                <div class="data-card">
                    <h3>Hips Offset</h3>
                    <div class="data-value placeholder" id="data-offset">-- cm</div>
                </div>
                <div class="data-card full-width">
                    <h3>Movement Velocity</h3>
                    <div class="data-value placeholder" id="data-velocity">0.0 m/s</div>
                </div>
            </div>

            <div class="panel-header">
                <h2>Trajectory Analysis</h2>
            </div>
            <div class="chart-box" id="data-chart-container">
                <canvas id="velocity-chart"></canvas>
            </div>
        </aside>
    </main>

    <script type="module" src="./mediaPipeOverlay.js?v=20260502"></script>
</body>

</html>
